a.btn{display:inline-block;text-decoration:none;text-align:center}.btn.wa{background:#25D366;color:#0b3d1e}.wafab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.3)}

.hb{display:grid;grid-template-columns:90px 1fr 120px;gap:8px;align-items:center;margin:6px 0;font-size:14px}.hbt{background:var(--bg);border-radius:6px;height:14px}.hbt i{display:block;height:100%;background:var(--brand);border-radius:6px}.hb b{text-align:right}

const emptyDb=()=>({categories:['Guitarras','Teclados','Audio','Micrófonos','Parlantes'],users:[],products:[],orders:[],complaints:[],store:{},shop:{iva:19,ship:15000,freeFrom:500000,coupons:[]},rental:{gear:[],packages:[],reservations:[],scales:{},cities:[],depositPct:30,guaPct:20}});
let db=emptyDb();
/* ---- Mapeo objeto JS <-> tabla: [clave, columna, valorPorDefecto, esFecha] ---- */
const T=[
{t:'usuarios',a:d=>d.users,s:(d,v)=>{d.users=v},m:[['id','id'],['name','name',''],['email','email',''],['pass','pass',''],['role','role','cliente']]},
{t:'productos',a:d=>d.products,s:(d,v)=>{d.products=v},m:[['id','id'],['name','name',''],['cat','cat',''],['price','price',0],['stock','stock',0],['desc','descr',''],['tags','tags',[]],['img','img','']]},
{t:'pedidos',a:d=>d.orders,s:(d,v)=>{d.orders=v},m:[['id','id'],['userId','user_id'],['date','date',null,1],['items','items',[]],['sub','sub',0],['disc','disc',0],['ship','ship',0],['iva','iva',0],['coupon','coupon'],['total','total',0],['addr','addr'],['method','method'],['ref','ref'],['status','status','Pendiente']]},
{t:'equipos_alquiler',a:d=>d.rental.gear,s:(d,v)=>{d.rental.gear=v},m:[['id','id'],['name','name',''],['price','price',0]]},
{t:'paquetes_alquiler',a:d=>d.rental.packages,s:(d,v)=>{d.rental.packages=v},m:[['id','id'],['name','name',''],['scale','scale','Pequeño'],['desc','descr',''],['price','price',0],['items','items',[]]]},
{t:'reservas_alquiler',a:d=>d.rental.reservations,s:(d,v)=>{d.rental.reservations=v},m:[['id','id'],['event','event'],['name','name'],['email','email'],['phone','phone'],['scale','scale'],['pkgName','pkg_name'],['items','items',[]],['start','start_date',null,1],['end','end_date',null,1],['days','days'],['pd','pd'],['eq','eq'],['disc','disc'],['tech','tech'],['transport','transport'],['city','city'],['total','total',0],['deposit','deposit'],['guarantee','guarantee'],['guaReturned','gua_returned',false],['depositPaid','deposit_paid',false],['depositPending','deposit_pending',false],['depositMethod','deposit_method'],['depositRef','deposit_ref'],['depositDate','deposit_date',null,1],['status','status','Pendiente'],['created','created',null,1],['block','block',false]]},
{t:'quejas_pqr',a:d=>d.complaints,s:(d,v)=>{d.complaints=v},m:[['id','id'],['type','type',''],['name','name',''],['email','email',''],['order','order'],['msg','msg',''],['date','date',null,1],['status','status','Recibida']]}
];
const CFG=[
['store',d=>d.store,(d,v)=>{d.store=v}],
['categorias',d=>d.categories,(d,v)=>{d.categories=Array.isArray(v)&&v.length?v:['General']}],
['shop',d=>d.shop,(d,v)=>{d.shop=v}],
['rental_scales',d=>d.rental.scales,(d,v)=>{d.rental.scales=v}],
['rental_cities',d=>d.rental.cities,(d,v)=>{d.rental.cities=v}],
['rental_deposit_pct',d=>d.rental.depositPct,(d,v)=>{d.rental.depositPct=+v}],
['rental_gua_pct',d=>d.rental.guaPct,(d,v)=>{d.rental.guaPct=+v}]
];
function toRow(o,m){const row={},used=new Set();
 for(const [k,c,def,isD] of m){let v=o[k];if(v===undefined||v===null)v=def===undefined?null:def;if(isD&&v==='')v=null;row[c]=v;used.add(k)}
 const extra={};for(const k in o){if(!used.has(k)&&o[k]!==undefined)extra[k]=o[k]}
 row.extra=extra;return row}
function fromRow(r,m){const o={...(r.extra||{})};for(const [k,c] of m){if(r[c]!==null&&r[c]!==undefined)o[k]=r[c]}return o}
async function fetchAll(table,order){let out=[],from=0;for(;;){let q=sb.from(table).select('*');if(order)q=q.order(order);const {data,error}=await q.range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
async function pull(){
 const rows=await Promise.all([...T.map(x=>fetchAll(x.t,'id')),fetchAll('configuracion_tienda')]);
 const nd=emptyDb();
 T.forEach((x,i)=>x.s(nd,rows[i].map(r=>fromRow(r,x.m))));
 const cfg={};rows[T.length].forEach(r=>cfg[r.clave]=r.valor);
 CFG.forEach(([k,,set])=>{if(cfg[k]!==undefined)set(nd,cfg[k])});
 Object.defineProperty(nd,'nextId',{get:nid,set(){},configurable:true});
 return nd}
/* ---- IDs únicos globales (secuencia en la base de datos) ---- */
let ID_POOL=[];let ID_BUSY=false;
async function refillIds(){if(ID_BUSY)return;ID_BUSY=true;try{const {data,error}=await sb.rpc('reservar_ids',{n:30});if(error)throw error;ID_POOL=ID_POOL.concat(data)}catch(e){console.error(e)}finally{ID_BUSY=false}}
function nid(){if(ID_POOL.length<8)refillIds();return ID_POOL.length?ID_POOL.shift():Date.now()*1000+Math.floor(Math.random()*1000)}
/* ---- Sincronización: solo se envían las filas que cambiaron ---- */
let SNAP={},CSNAP={};
function snapOf(d){const s={},c={};T.forEach(x=>{const mp=new Map();x.a(d).forEach(o=>{const r=toRow(o,x.m);mp.set(r.id,JSON.stringify(r))});s[x.t]=mp});CFG.forEach(([k,get])=>{c[k]=JSON.stringify(get(d)===undefined?null:get(d))});return{s,c}}
function snapStr(sn){return JSON.stringify([Object.entries(sn.s).map(([k,v])=>[k,[...v]]),sn.c])}
function setSnap(d){const sn=snapOf(d);SNAP=sn.s;CSNAP=sn.c}
async function sync(){
 for(const x of T){
  const seen=new Set(),up=[];
  for(const o of x.a(db)){const row=toRow(o,x.m),j=JSON.stringify(row);seen.add(row.id);if(SNAP[x.t].get(row.id)!==j)up.push([row,j])}
  const del=[...SNAP[x.t].keys()].filter(id=>!seen.has(id));
  if(up.length){const {error}=await sb.from(x.t).upsert(up.map(u=>u[0]));if(error)throw error;up.forEach(([r,j])=>SNAP[x.t].set(r.id,j))}
  if(del.length){const {error}=await sb.from(x.t).delete().in('id',del);if(error)throw error;del.forEach(id=>SNAP[x.t].delete(id))}
 }
 for(const [k,get] of CFG){const v=get(db),j=JSON.stringify(v===undefined?null:v);if(CSNAP[k]!==j){const {error}=await sb.from('configuracion_tienda').upsert({clave:k,valor:v===undefined?null:v});if(error)throw error;CSNAP[k]=j}}
}
let _syncT=null,_chain=Promise.resolve(),_pend=0;
const save=()=>{if(!_syncT){_pend++;_syncT=setTimeout(()=>{_syncT=null;_chain=_chain.then(sync).catch(async e=>{console.error(e);toast('No se pudo guardar en la base de datos. Recargando datos…');try{await applyPull(true)}catch(_){}}).finally(()=>{_pend--})},0)}return true};
async function applyPull(force){
 const nd=await pull();
 if(!force){if(_pend||_syncT)return;if(snapStr(snapOf(nd))===snapStr({s:SNAP,c:CSNAP}))return}
 db=nd;setSnap(db);
 if(S.user){const u=db.users.find(x=>x.id==S.user.id);if(u)S.user=u}
 
 if(!$('#modal').classList.contains('on'))render()}
async function bgPull(){if(_pend||_syncT)return;try{await applyPull(false)}catch(e){console.error(e)}}
async function boot(){
 $('#view').innerHTML='<div class="panel" style="text-align:center"><p>Cargando…</p></div>';
 try{db=await pull();setSnap(db);await refillIds();Object.assign(STORE,db.store||{});fab();render()}
 catch(e){console.error(e);$('#view').innerHTML='<div class="panel"><h3>No se pudo conectar con la base de datos</h3><p>Revisa tu conexión e inténtalo de nuevo.</p><button class="btn" onclick="boot()">Reintentar</button></div>'}}

function shop(){
 const list=plist();
 return `<section class="hero"><div><h1>El sonido que buscas, listo para tocar.</h1>
 <p>Guitarras, teclados, micrófonos y equipos de estudio con envío a todo el país y pago seguro.</p></div>
 <div class="eq" aria-hidden="true">${Array.from({length:18},(_,i)=>`<i style="animation-delay:-${(i*0.37%1.2).toFixed(2)}s;animation-duration:${(0.8+(i*0.13)%0.9).toFixed(2)}s"></i>`).join('')}</div></section>
 <div class="bar"><input id="q" type="search" placeholder="Buscar un instrumento o equipo" value="${esc(S.q)}" oninput="S.q=this.value;list()" aria-label="Buscar"><select onchange="S.sort=this.value;list()" aria-label="Ordenar" style="width:auto"><option value="">Ordenar</option><option value="asc" ${S.sort=='asc'?'selected':''}>Precio: menor a mayor</option><option value="desc" ${S.sort=='desc'?'selected':''}>Precio: mayor a menor</option></select>

function qty(id,d){const i=S.cart.find(x=>x.id==id),p=db.products.find(x=>x.id==id);i.q+=d;

function checkout(){
 if(!S.user){closeModal();toast('Ingresa o crea tu cuenta para pagar');return go('account')}
 openModal(`<h2>Finalizar compra</h2><div class="f">
 <label>Dirección de envío<input id="addr" placeholder="Calle, número, ciudad" required></label>
 <div class="pay">${Object.entries(PAYS).filter(([k])=>k!='gw'||gwOn()).map(([k,v],i)=>`<label><input type="radio" name="pm" value="${k}" ${i?'':'checked'} onchange="payFields()"> ${v}</label>`).join('')}</div>

function payFields(){const m=document.querySelector('input[name=pm]:checked').value;
 $('#pf').innerHTML={card:`<div class="f"><label>Número de tarjeta<input id="cn" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000"></label>
 <div class="row"><label>Vence<input id="cv" placeholder="MM/AA" maxlength="5"></label><label>CVV<input id="cc" inputmode="numeric" maxlength="4"></label></div></div>`,
 pse:`<label class="f">Banco<select id="bk"><option>Bancolombia</option><option>Davivienda</option><option>Banco de Bogotá</option><option>BBVA</option><option>Nequi</option></select></label>`,
 nequi:`<label class="f">Número de celular<input id="ph" inputmode="numeric" maxlength="10" placeholder="3001234567"></label>`,
 cod:`<p>Pagas en efectivo cuando recibas el pedido.</p>`,gw:`<p>Te llevaremos a la página segura de la pasarela para completar el pago. Tu pedido queda pendiente hasta que verifiquemos el pago.</p>`}[m]}
function pay(){
 const m=document.querySelector('input[name=pm]:checked').value,addr=$('#addr').value.trim();
 if(!addr)return toast('Escribe la dirección de envío');
 let ref='';
 if(m=='card'){const n=$('#cn').value.replace(/\s/g,'');if(!/^\d{13,19}$/.test(n)||!/^\d\d\/\d\d$/.test($('#cv').value)||!/^\d{3,4}$/.test($('#cc').value))return toast('Revisa los datos de la tarjeta');ref='•••• '+n.slice(-4)}
 if(m=='pse')ref=$('#bk').value;
 if(m=='nequi'){const t=$('#ph').value;if(!/^3\d{9}$/.test(t))return toast('Escribe un celular válido de 10 dígitos');ref='***'+t.slice(-4)}
 const c=calc();const items=S.cart.map(i=>{const p=db.products.find(x=>x.id==i.id);p.stock-=i.q;return{id:p.id,name:p.name,q:i.q,price:p.price}});

 db.orders.push(o);save();S.cart=[];
 openModal(`<h2>¡Pedido confirmado!</h2><p>Pedido #${o.id} por ${fmt(o.total)}. ${m=='cod'?'Pagarás al recibirlo.':m=='gw'?'Completa el pago en la pasarela y usa "Pedido #'+o.id+'" como referencia. Lo marcaremos como pagado cuando lo verifiquemos.':'Pago recibido.'}</p>${m=='gw'?payA('Pedido #'+o.id):''}<div class="row"><button class="btn" onclick="closeModal();go('account')">Ver mis pedidos</button><button class="btn alt" onclick="invoice(${o.id})">Descargar factura</button></div>`);nav();

let draftImg='';
function adminProds(){return `${catPanel()}<div class="panel"><button class="btn" onclick="prodForm(0)">Nuevo producto</button></div><div class="panel tbl"><table><tr><th></th><th>Producto</th><th>Etiquetas</th><th>Precio</th><th>Stock</th><th></th></tr>${db.products.map(p=>`<tr><td><div class="tile" style="width:56px;height:44px;font-size:22px;border-radius:6px">${p.img?`<img src="${p.img}" alt="">`:(ICON[p.cat]||'🎶')}</div></td><td>${esc(p.name)}</td><td>${esc((p.tags||[]).join(', '))}</td><td>${fmt(p.price)}</td><td>${p.stock}</td><td><button class="btn alt sm" onclick="prodForm(${p.id})">Editar</button> <button class="btn alt sm" onclick="delProd(${p.id})">Eliminar</button></td></tr>`).join('')}</table></div>`}
function prodForm(id){const p=id?db.products.find(x=>x.id==id):{name:'',cat:db.categories[0],price:'',stock:'',desc:'',tags:[],img:''};draftImg=p.img||'';
openModal(`<h2>${id?'Editar':'Nuevo'} producto</h2><div class="f" style="margin-top:12px"><label>Nombre<input id="fn" value="${esc(p.name)}"></label>
<label>Categoría<select id="fc">${[...new Set([...db.categories,p.cat])].filter(Boolean).map(c=>`<option ${c==p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>

<label>Descripción<textarea id="fd" rows="3">${esc(p.desc)}</textarea></label>
<label>Etiquetas (separadas por coma)<input id="ft" value="${esc((p.tags||[]).join(', '))}" placeholder="acústica, principiante"></label>
<label>Imagen<input id="fi" type="file" accept="image/*" onchange="pickImg(this)"></label>
<div id="fprev">${p.img?`<img src="${p.img}" alt="Vista previa" style="max-width:160px;border-radius:8px">`:''}</div>
<button class="btn" onclick="saveProd(${id||0})">Guardar producto</button></div>`)}
function pickImg(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);draftImg=c.toDataURL('image/jpeg',.8);$('#fprev').innerHTML=`<img src="${draftImg}" alt="Vista previa" style="max-width:160px;border-radius:8px">`};im.onerror=()=>toast('No se pudo leer esa imagen');im.src=r.result};r.readAsDataURL(f)}
function saveProd(id){const n=$('#fn').value.trim(),pr=+$('#fp').value,st=+$('#fs').value;
 if(!n||pr<=0||$('#fs').value===''||st<0)return toast('Completa nombre, precio y stock');

 if(id)Object.assign(db.products.find(p=>p.id==id),d);else db.products.push({id:db.nextId++,...d});
 const ok=save();closeModal();render();toast(ok?'Producto guardado':'Guardado solo en esta sesión: la imagen ocupa demasiado espacio')}

async function invoice(id){const o=db.orders.find(x=>x.id==id),u=db.users.find(x=>x.id==o.userId)||{name:'—',email:'—'};
 const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return toast('No se pudo cargar el generador de PDF');
 let d=true;
 if(!d)return toast('La descarga no está disponible en esta vista');
 const doc=new J();let y=20;
 doc.setFontSize(20);doc.text('7tono',14,y);doc.setFontSize(10);doc.text('Instrumentos y equipos de sonido',14,y+6);
 doc.setFontSize(16);doc.text('Factura #'+String(o.id).padStart(5,'0'),196,y,{align:'right'});
 y+=20;doc.setFontSize(10);
 doc.text('Fecha: '+o.date,14,y);doc.text('Cliente: '+u.name,14,y+6);doc.text('Correo: '+u.email,14,y+12);doc.text('Envío: '+o.addr,14,y+18);doc.text('Pago: '+PAYS[o.method]+(o.ref?' ('+o.ref+')':''),14,y+24);doc.text('Estado: '+o.status,14,y+30);

function backfillRes(){const rs=db.rental;rs.reservations.forEach(r=>{if(r.block||r.pd!=null||!r.total||!r.start)return;const days=r.days||nd(r.start,r.end),tech=((rs.scales[r.scale]||{}).tech||0)*days,base=Math.max(0,r.total-tech),eq=days>=3?Math.round(base/0.9):base;Object.assign(r,{days,tech,eq,disc:eq-base,pd:Math.round(eq/days),transport:0,city:'No registrado',deposit:r.deposit!=null?r.deposit:Math.round(r.total*rs.depositPct/100),depositPaid:!!r.depositPaid})})}
function bk(r){return 'Equipos '+fmt((r.eq||0)-(r.disc||0))+' · Técnico '+fmt(r.tech||0)+(r.transport?' · Transporte '+fmt(r.transport):'')}

/* Pago del anticipo */
function readPay(){const m=document.querySelector('input[name=pm]:checked').value;
 if(m=='card'){const n=$('#cn').value.replace(/ /g,'');if(!/^[0-9]{13,19}$/.test(n)||!/^[0-9]{2}[/][0-9]{2}$/.test($('#cv').value)||!/^[0-9]{3,4}$/.test($('#cc').value)){toast('Revisa los datos de la tarjeta');return null}return{m,ref:'•••• '+n.slice(-4)}}
 if(m=='nequi'){const t=$('#ph').value;if(!/^3[0-9]{9}$/.test(t)){toast('Escribe un celular válido de 10 dígitos');return null}return{m,ref:'***'+t.slice(-4)}}
 if(m=='gw')return{m,ref:''};return{m,ref:$('#bk').value}}
function payDep(id){const r=db.rental.reservations.find(x=>x.id==id);if(r.depositPaid)return toast('El anticipo de esta reserva ya está pagado');const amt=r.deposit!=null?r.deposit:Math.round(r.total*db.rental.depositPct/100);
 openModal(`<h2>Pagar anticipo</h2><p>Reserva <b>${rcode(r.id)}</b> · ${esc(r.event)}<br>Anticipo: <b>${fmt(amt)}</b> de ${fmt(r.total)} (saldo ${fmt(r.total-amt)})</p><div class="f" style="max-width:none"><div class="pay">${['card','pse','nequi'].concat(gwOn()?['gw']:[]).map((k,i)=>`<label><input type="radio" name="pm" value="${k}" ${i?'':'checked'} onchange="payFields()"> ${PAYS[k]}</label>`).join('')}</div><div id="pf"></div><small>Pasarela simulada: no se procesa ningún cobro real ni se guardan datos de tarjeta.</small><button class="btn" onclick="confirmDep(${r.id},${amt})">Pagar ${fmt(amt)}</button></div>`);payFields()}
function confirmDep(id,amt){const p=readPay();if(!p)return;const r=db.rental.reservations.find(x=>x.id==id);
 if(p.m=='gw'){Object.assign(r,{deposit:amt,depositMethod:'gw',depositPending:true});save();openModal(`<h2>Completa el pago del anticipo</h2><p>Paga <b>${fmt(amt)}</b> en la pasarela y usa <b>${rcode(r.id)}</b> como referencia. Cuando verifiquemos el pago, el anticipo quedará marcado como recibido.</p>${payA(rcode(r.id))}<button class="btn alt" onclick="closeModal()">Cerrar</button>`);if(S.view=='alquiler')ra();return}Object.assign(r,{deposit:amt,depositPaid:true,depositMethod:p.m,depositRef:p.ref,depositDate:today()});save();
 openModal(`<h2>¡Anticipo recibido!</h2><p>Pagaste <b>${fmt(amt)}</b> de la reserva ${rcode(r.id)}. Las fechas quedan apartadas mientras la confirmamos. Saldo restante: ${fmt(r.total-amt)}.</p><div class="row"><button class="btn" onclick="rentPdf(${r.id})">Descargar factura</button><button class="btn alt" onclick="closeModal()">Cerrar</button></div>`);if(S.view=='alquiler')ra();else if(S.view=='admin')render()}

/* Verificación (captcha) al crear cuenta */
let CAP={ans:'',mode:'img',txt:''};
function capNew(){if(CAP.mode=='sum'){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);CAP.ans=String(a+b);CAP.txt=a+' + '+b+' = ?'}else{const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';CAP.ans='';for(let i=0;i<5;i++)CAP.ans+=L[Math.floor(Math.random()*L.length)]}}
function capInner(fresh){if(fresh)capNew();setTimeout(capDraw,0);return CAP.mode=='sum'?`<div class="capbox" role="img" aria-label="Suma de verificación"><b>${CAP.txt}</b></div>`:`<canvas id="capc" class="capbox" width="180" height="52" role="img" aria-label="Código de verificación de 5 caracteres"></canvas>`}
function capDraw(){const c=$('#capc');if(!c)return;const x=c.getContext('2d');x.fillStyle='#e9edef';x.fillRect(0,0,180,52);
 for(let i=0;i<7;i++){x.strokeStyle='hsl('+Math.floor(Math.random()*360)+',40%,45%)';x.beginPath();x.moveTo(Math.random()*180,Math.random()*52);x.lineTo(Math.random()*180,Math.random()*52);x.stroke()}
 CAP.ans.split('').forEach((ch,i)=>{x.save();x.translate(18+i*32,34);x.rotate((Math.random()-.5)*.7);x.font='bold '+Math.floor(26+Math.random()*6)+'px sans-serif';x.fillStyle='#12232b';x.fillText(ch,-8,0);x.restore()})}
function capRefresh(){$('#capw').innerHTML=capInner(true);$('#rc').value=''}
function capMode(){CAP.mode=CAP.mode=='img'?'sum':'img';capRefresh()}
function fab(){const o=document.querySelector('.wafab');if(o)o.remove();document.body.insertAdjacentHTML('beforeend',waA('💬 WhatsApp','Hola 7tono, quisiera información sobre sus productos.','btn wa wafab'))}
function setStore(k,v){v=v.trim();if(k=='wa'){v=v.replace(/[^0-9]/g,'');if(v.length==10&&v[0]=='3')v='57'+v;if(v&&v.length<11)return toast('Escribe el número con indicativo, por ejemplo 573001234567')}
 if(k=='payUrl'&&v&&!/^https:[/][/]/.test(v))return toast('El enlace debe empezar por https://');
 db.store=db.store||{};db.store[k]=v;STORE[k]=v;save();fab();render();toast('Guardado')}

/* Envío, IVA y cupones */
function plist(){const l=db.products.filter(match);if(S.sort=='asc')l.sort((a,b)=>a.price-b.price);else if(S.sort=='desc')l.sort((a,b)=>b.price-a.price);return l}
function calc(){const sh=db.shop,sub=total(),k=sh.coupons.find(x=>x.code==S.coupon&&x.active),disc=k?Math.round(sub*k.pct/100):0,base=sub-disc,ship=!sub||(sh.freeFrom&&sub>=sh.freeFrom)?0:sh.ship,iva=Math.round(base*sh.iva/(100+sh.iva));return{sub,disc,code:k?k.code:'',ship,iva,total:base+ship}}
function summary(chk){const c=calc();return kv('Subtotal',fmt(c.sub))+(c.disc?kv('Cupón '+esc(c.code),'-'+fmt(c.disc)):'')+kv('Envío',c.ship?fmt(c.ship):'Gratis')+kv('IVA incluido ('+db.shop.iva+'%)',fmt(c.iva))+kv('Total','<b>'+fmt(c.total)+'</b>','font-size:18px')+(chk?'':`<div class="row" style="margin:10px 0"><input class="in" id="cp" placeholder="Cupón de descuento" style="flex:1"><button class="btn alt sm" onclick="applyCoupon()">Aplicar</button></div>`+(c.ship&&db.shop.freeFrom?`<small>Envío gratis desde ${fmt(db.shop.freeFrom)}.</small>`:''))}
function applyCoupon(){const c=($('#cp').value||'').trim().toUpperCase();const k=db.shop.coupons.find(x=>x.code==c&&x.active);if(!k)return toast('Ese cupón no es válido');S.coupon=k.code;toast('Cupón aplicado: '+k.pct+'% de descuento');cartModal()}

/* Disponibilidad por día o por inventario */
function dayTaken(day,req,ig){const act=db.rental.reservations.filter(r=>r.status!='Cancelada'&&r.id!=ig&&r.start<=day&&r.end>=day);
 if(db.rental.mode!='inventario')return act.length>0;
 if(act.some(r=>r.block||!r.items||r.items.some(i=>i.eid==null)))return true;
 return req.some(q=>{const g=gear(q.eid);const used=act.reduce((a,r)=>a+((r.items.find(i=>i.eid==q.eid)||{}).q||0),0);return g&&used+q.q>(g.units||1)})}
function rangeTaken(s,e,req,ig){for(let d=s;d<=e;d=addD(d,1))if(dayTaken(d,req,ig))return true;return false}
function setUnits(id,v){gear(id).units=Math.max(1,Math.floor(+v||1));save();toast('Unidades guardadas')}
function setGua(id,v){db.rental.reservations.find(r=>r.id==id).guaReturned=v;save();toast(v?'Garantía marcada como devuelta':'Garantía desmarcada')}

/* Ajustes de administración */
function adminSet(){const sh=db.shop,rs=db.rental,st=STORE;return `${catPanel()}<div class="panel"><h3>Datos de contacto y WhatsApp</h3><div class="f" style="max-width:none">${[['wa','WhatsApp (con indicativo, solo números)','tel'],['tel','Teléfono','tel'],['mail','Correo de contacto','email'],['addr','Dirección y ciudad','text'],['hours','Horario de atención','text'],['payUrl','Enlace de la pasarela de pago (https)','url']].map(([k,l,t])=>`<label>${l}<input type="${t}" value="${esc(st[k]||'')}" onchange="setStore('${k}',this.value)"></label>`).join('')}</div><p style="margin:10px 0 0">${waA('Probar mi WhatsApp','Hola, esto es una prueba desde 7tono.')}</p></div><div class="panel"><h3>Tienda: IVA y envío</h3><div class="f" style="max-width:none"><label>IVA incluido en los precios (%)<input type="number" min="0" value="${sh.iva}" onchange="setSh('iva',this.value)"></label><label>Valor del envío (COP)<input type="number" min="0" value="${sh.ship}" onchange="setSh('ship',this.value)"></label><label>Envío gratis desde (COP, 0 = nunca)<input type="number" min="0" value="${sh.freeFrom}" onchange="setSh('freeFrom',this.value)"></label></div></div>
<div class="panel tbl"><h3>Cupones</h3><table style="min-width:0"><tr><th>Código</th><th>Descuento</th><th>Activo</th><th></th></tr>${sh.coupons.map((c,i)=>`<tr><td>${esc(c.code)}</td><td>${c.pct}%</td><td><input type="checkbox" style="width:auto" ${c.active?'checked':''} onchange="togCoupon(${i},this.checked)" aria-label="Activo"></td><td><button class="btn alt sm" onclick="delCoupon(${i})">Eliminar</button></td></tr>`).join('')}</table><div class="row" style="margin-top:10px"><input class="in" id="kc" placeholder="CÓDIGO" style="width:150px"><input class="in" id="kp" type="number" min="1" max="100" placeholder="% desc." style="width:110px"><button class="btn" onclick="addCoupon()">Agregar cupón</button></div></div>
<div class="panel"><h3>Alquiler</h3><div class="f" style="max-width:none"><label>Disponibilidad<select onchange="db.rental.mode=this.value;save();toast('Guardado')"><option value="dia" ${rs.mode!='inventario'?'selected':''}>Un evento por día (bloquea el día completo)</option><option value="inventario" ${rs.mode=='inventario'?'selected':''}>Por inventario (según las unidades de cada equipo)</option></select></label><label>Depósito de garantía (% del subtotal de equipos)<input type="number" min="0" max="100" value="${rs.guaPct}" onchange="db.rental.guaPct=Math.min(100,Math.max(0,+this.value||0));save();toast('Guardado')"></label></div></div>`}
function catPanel(){return `<div class="panel"><h3>Categorías de productos</h3><p style="margin:0 0 10px">Agrega o elimina categorías (por ejemplo «Uñas de guitarra» o «Cuerdas»). Aparecen en los filtros de la tienda y en el formulario de productos. Si borras una con productos, se mueven a otra categoría.</p><div style="display:grid;gap:8px;max-width:520px">${db.categories.map((c,i)=>`<div class="row" style="align-items:center;gap:8px"><input value="${esc(c)}" maxlength="30" onchange="renCat(${i},this.value)" style="flex:1"><small>${db.products.filter(p=>p.cat==c).length} prod.</small><button class="btn alt sm" onclick="delCat(${i})">Borrar</button></div>`).join('')}<div class="row" style="align-items:center;gap:8px"><input id="nc" maxlength="30" placeholder="Nueva categoría (ej. Percusión)" style="flex:1" onkeydown="if(event.key==='Enter')addCat()"><button class="btn sm" onclick="addCat()">Agregar</button></div></div></div>`}
function cleanCat(v){return String(v||'').trim().replace(/\s+/g,' ')}
function addCat(){const n=cleanCat($('#nc').value);if(!n)return toast('Escribe el nombre de la categoría');if(db.categories.some(c=>c.toLowerCase()==n.toLowerCase()))return toast('Esa categoría ya existe');db.categories.push(n);save();toast('Categoría agregada');render()}
function delCat(i){const c=db.categories[i];if(db.categories.length<2)return toast('Debe quedar al menos una categoría');const prods=db.products.filter(p=>p.cat==c),dest=db.categories.find((x,j)=>j!=i);if(prods.length&&!confirm('«'+c+'» tiene '+prods.length+' producto(s). Se moverán a «'+dest+'». ¿Borrar la categoría?'))return;prods.forEach(p=>{p.cat=dest});db.categories.splice(i,1);if(S.cat==c)S.cat='Todos';save();toast('Categoría eliminada');render()}
function renCat(i,v){v=cleanCat(v);const old=db.categories[i];if(!v||v==old)return render();if(db.categories.some((c,j)=>j!=i&&c.toLowerCase()==v.toLowerCase())){toast('Esa categoría ya existe');return render()}db.products.forEach(p=>{if(p.cat==old)p.cat=v});db.categories[i]=v;if(S.cat==old)S.cat=v;save();toast('Guardado');render()}
function setSh(k,v){db.shop[k]=Math.max(0,+v||0);save();toast('Guardado')}
function togCoupon(i,v){db.shop.coupons[i].active=v;save();toast('Guardado')}
function delCoupon(i){db.shop.coupons.splice(i,1);save();render()}
function addCoupon(){const c=$('#kc').value.trim().toUpperCase().replace(/ /g,''),p=Math.floor(+$('#kp').value);if(!c||p<1||p>100)return toast('Escribe un código y un descuento entre 1 y 100');if(db.shop.coupons.some(x=>x.code==c))return toast('Ese código ya existe');db.shop.coupons.push({code:c,pct:p,active:true});save();render()}

/* Reportes y exportación */
function bars(rows,plain){if(!rows.length)return '';const mx=Math.max(...rows.map(r=>r[1]),1);return rows.map(([l,v])=>`<div class="hb"><span>${esc(l)}</span><div class="hbt"><i style="width:${Math.round(v/mx*100)}%"></i></div><b>${plain?v+' uds':fmt(v)}</b></div>`).join('')}
function adminRep(){const act=db.orders.filter(o=>o.status!='Cancelado'),rv=db.rental.reservations.filter(r=>!r.block&&r.status!='Cancelada'),months=[],n=new Date();
 for(let i=5;i>=0;i--)months.push(ymd(new Date(n.getFullYear(),n.getMonth()-i,1)).slice(0,7));
 const sum=(l,k,f)=>months.map(m=>[m,l.filter(x=>(x[k]||'').slice(0,7)==m).reduce((a,x)=>a+f(x),0)]),top={};act.forEach(o=>o.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.q));
 let occ=0;for(let i=0;i<30;i++)if(conflict(addD(today(),i),addD(today(),i)))occ++;
 return `<div class="stats"><div class="panel stat"><b>${fmt(act.reduce((a,o)=>a+o.total,0))}</b>Ventas de la tienda</div><div class="panel stat"><b>${fmt(rv.reduce((a,r)=>a+r.total,0))}</b>Alquileres</div><div class="panel stat"><b>${Math.round(occ/30*100)}%</b>Días ocupados, próximos 30</div></div>
<div class="panel"><h3>Ventas de la tienda por mes</h3>${bars(sum(act,'date',o=>o.total))}</div><div class="panel"><h3>Alquileres por mes de inicio</h3>${bars(sum(rv,'start',r=>r.total))}</div>
<div class="panel"><h3>Productos más vendidos</h3>${bars(Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),1)||'<p>Aún no hay ventas.</p>'}</div>
<div class="panel"><h3>Exportar a Excel (CSV)</h3><div class="row"><button class="btn alt" onclick="csv('pedidos')">Pedidos</button><button class="btn alt" onclick="csv('clientes')">Clientes</button><button class="btn alt" onclick="csv('reservas')">Reservas</button></div></div>`}
async function csv(w){let rows;
 if(w=='pedidos')rows=[['Pedido','Fecha','Cliente','Total','Pago','Estado']].concat(db.orders.map(o=>{const u=db.users.find(x=>x.id==o.userId)||{};return[o.id,o.date,u.name,o.total,PAYS[o.method].split(' (')[0],o.status]}));
 else if(w=='clientes')rows=[['Nombre','Correo','Pedidos','Total comprado']].concat(db.users.filter(u=>u.role=='cliente').map(u=>{const os=db.orders.filter(o=>o.userId==u.id);return[u.name,u.email,os.length,os.reduce((a,o)=>a+o.total,0)]}));
 else rows=[['Código','Evento','Cliente','Inicio','Fin','Total','Estado']].concat(db.rental.reservations.filter(r=>!r.block).map(r=>[rcode(r.id),r.event,r.name,r.start,r.end,r.total,r.status]));
 let d=true;if(!d)return toast('La descarga no está disponible en esta vista');
 const t='\ufeff'+rows.map(r=>r.map(v=>{let s=String(v==null?'':v);if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\n');
 try{dlBlob(w+'.csv',new Blob([t],{type:'text/csv;charset=utf-8'}))}catch(e){if(!e||e.code!=='declined')toast('No se pudo guardar el archivo')}}

/* Contrato de alquiler en PDF */
async function pdfStart(){const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('No se pudo cargar el generador de PDF');return null}let dl=true;if(!dl){toast('La descarga no está disponible en esta vista');return null}return{J,dl}}
async function contractPdf(id){const r=db.rental.reservations.find(x=>x.id==id),p=await pdfStart();if(!p)return;const doc=new p.J(),dep=r.deposit!=null?r.deposit:Math.round(r.total*db.rental.depositPct/100);let y=20;
 const H=t=>{if(y>270){doc.addPage();y=20}doc.setFont(undefined,'bold');doc.setFontSize(11);doc.text(t,14,y);y+=6;doc.setFont(undefined,'normal');doc.setFontSize(10)};
 const P=t=>{doc.splitTextToSize(t,182).forEach(l=>{if(y>280){doc.addPage();y=20}doc.text(l,14,y);y+=5});y+=3};
 doc.setFontSize(16);doc.text('Contrato de alquiler de equipos de sonido',14,y);y+=6;doc.setFontSize(10);doc.text('Contrato '+rcode(r.id)+' · '+fdate(today()),14,y);y+=10;
 H('1. Partes');P('ARRENDADOR: 7tono ([razón social], NIT [número]). ARRENDATARIO: '+r.name+', correo '+r.email+', celular '+r.phone+'.');
 H('2. Objeto');P('El arrendador entrega en alquiler los siguientes equipos para el evento "'+r.event+'" en '+(r.city||'la ciudad acordada')+': '+(r.items||[]).map(i=>i.q+' x '+i.name).join(', ')+'.');
 H('3. Duración');P('Del '+fdate(r.start)+' al '+fdate(r.end)+' ('+r.days+(r.days>1?' días':' día')+'). Lugar y hora de entrega y recolección: [por definir].');
 H('4. Precio y forma de pago');P('Valor total: '+fmt(r.total)+'. Anticipo: '+fmt(dep)+(r.depositPaid?' (recibido)':' (pendiente)')+'. Saldo: '+fmt(r.total-dep)+', pagadero [antes del evento / en la entrega].');
 H('5. Depósito de garantía');P(r.guarantee?'El arrendatario entrega un depósito de garantía de '+fmt(r.guarantee)+', que se reembolsa al devolver los equipos completos y en buen estado. Podrán descontarse de él el valor de daños o faltantes.':'No se pacta depósito de garantía.');
 H('6. Obligaciones del arrendatario');P('Usar los equipos solo para el evento indicado, no subarrendarlos, impedir su manipulación por personas no autorizadas, responder por su pérdida o daño y devolverlos en la fecha acordada.');
 H('7. Obligaciones del arrendador');P('Entregar los equipos en correcto funcionamiento, con el montaje y el soporte técnico incluidos en la cotización.');
 H('8. Cancelación y cambios');P('[Definir condiciones de cancelación, reprogramación y devolución del anticipo.]');
 H('9. Ley aplicable');P('Este contrato se rige por las leyes de la República de Colombia.');
 y+=14;if(y>260){doc.addPage();y=30}doc.line(14,y,90,y);doc.line(114,y,190,y);doc.text('Arrendador',14,y+5);doc.text('Arrendatario: '+r.name,114,y+5);
 doc.setFontSize(8);doc.text('Plantilla de demostración: debe ser revisada por un abogado antes de usarla.',14,288);
 try{doc.save('contrato-'+rcode(r.id)+'.pdf')}catch(e){if(!e||e.code!=='declined')toast('No se pudo guardar el contrato')}}

boot();
